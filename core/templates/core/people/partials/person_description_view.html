<div id="person-description-card">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
        <div>
            <h6 class="mb-1">Omschrijving</h6>
            <div class="text-muted small">Korte dossieromschrijving</div>
        </div>

        <button
            class="btn btn-sm btn-outline-secondary"
            hx-get="{% url 'people:description_edit_partial' person.id %}"
            hx-target="#person-description-card"
            hx-swap="outerHTML">
            Bewerken
        </button>
    </div>

    <hr class="my-3">

    <div class="text-body">
        {% if person.description %}
            {{ person.description|linebreaksbr }}
        {% else %}
            <span class="text-muted">Nog geen omschrijving ingevuld.</span>
        {% endif %}
    </div>
</div>
