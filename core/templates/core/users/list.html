{% extends "base.html" %}
{% block title %}Gebruikers{% endblock %}

{% block content %}
<h1>Gebruikers</h1>

<table>
    <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Actie</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <<form method="post" action="{% url 'impersonation:start' user.id %}">
                        {% csrf_token %}
                        <button type="submit">Bekijk als</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
